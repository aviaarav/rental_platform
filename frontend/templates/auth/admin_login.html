{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <div class="role-circle bg-primary mx-auto mb-3">A</div>
                <h3 class="fw-bold text-deep text-center mb-1">Admin Login</h3>
                <p class="text-muted text-center small mb-4">Authorized administrators only</p>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Login as Admin</button>
                </form>
                <p class="text-center small mt-3 mb-0"><a href="{{ url_for('main.home') }}" class="text-decoration-none">Back to user site</a></p>
            </div>
            <p class="text-center small text-muted mt-3">Ordinary users cannot open admin pages.</p>
        </div>
    </div>
</div>
{% endblock %}
