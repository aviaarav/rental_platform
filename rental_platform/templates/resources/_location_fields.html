<div class="col-md-6">
    <label class="form-label">District</label>
    <select name="district" class="form-select" data-district-select required>
        <option value="">Select district</option>
        {% for d in districts %}
        <option value="{{ d }}" {{ 'selected' if form.get('district') == d }}>{{ d }}</option>
        {% endfor %}
    </select>
</div>
<div class="col-md-6">
    <label class="form-label">Taluk <span class="text-muted small">(depends on District)</span></label>
    <select name="taluk" class="form-select" data-taluk-select data-selected="{{ form.get('taluk', '') }}" required>
        <option value="">Select taluk</option>
    </select>
</div>
<div class="col-md-4">
    <label class="form-label">Latitude</label>
    <input type="text" name="latitude" class="form-control" value="{{ form.get('latitude', '') }}" placeholder="e.g. 11.0168" data-lat-input>
</div>
<div class="col-md-4">
    <label class="form-label">Longitude</label>
    <input type="text" name="longitude" class="form-control" value="{{ form.get('longitude', '') }}" placeholder="e.g. 76.9558" data-lng-input>
</div>
<div class="col-md-4 d-flex align-items-end">
    <button type="button" class="btn btn-outline-primary w-100" data-use-location>
        <i class="bi bi-geo-alt me-1"></i> Use My Current Location
    </button>
</div>
<div class="col-12">
    <div class="small text-muted" data-location-status>
        Click the button while you are at the item's location. Coordinates are used to show distance to people who book. You can also leave them empty.
    </div>
</div>
