{# Route map drawn from latitude / longitude. points = (x1, y1, x2, y2) from utils.geo.route_points #}
{% macro route_map(points, distance, label_a='You', label_b='Resource') -%}
<svg viewBox="0 0 420 200" class="route-map" role="img" aria-label="Route from {{ label_a }} to {{ label_b }}, {{ distance }}">
    <rect width="420" height="200" rx="10" fill="#e3eefe"/>
    <rect x="16" y="14" width="74" height="40" rx="6" fill="#cfe0fb"/>
    <rect x="330" y="14" width="74" height="30" rx="6" fill="#cfe0fb"/>
    <rect x="20" y="150" width="60" height="36" rx="6" fill="#cfe0fb"/>
    <rect x="300" y="146" width="96" height="40" rx="6" fill="#cfe0fb"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#ffffff" stroke-width="7"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#ffffff" stroke-width="7"/>
    <line x1="280" y1="0" x2="280" y2="200" stroke="#ffffff" stroke-width="4"/>
    <line x1="{{ points[0] }}" y1="{{ points[1] }}" x2="{{ points[2] }}" y2="{{ points[3] }}" stroke="#0d6efd" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="{{ points[0] }}" cy="{{ points[1] }}" r="10" fill="#0d6efd"/>
    <circle cx="{{ points[0] }}" cy="{{ points[1] }}" r="4" fill="#ffffff"/>
    <text x="{{ points[0] }}" y="{{ points[1] + 26 }}" text-anchor="middle" font-size="11" font-weight="700" fill="#0a4cb8">{{ label_a }}</text>
    <circle cx="{{ points[2] }}" cy="{{ points[3] }}" r="10" fill="#dc3545"/>
    <circle cx="{{ points[2] }}" cy="{{ points[3] }}" r="4" fill="#ffffff"/>
    <text x="{{ points[2] }}" y="{{ points[3] + 26 }}" text-anchor="middle" font-size="11" font-weight="700" fill="#dc3545">{{ label_b }}</text>
    <rect x="{{ ((points[0] + points[2]) / 2) - 36 }}" y="{{ ((points[1] + points[3]) / 2) - 28 }}" width="72" height="20" rx="10" fill="#ffffff" stroke="#0d6efd"/>
    <text x="{{ (points[0] + points[2]) / 2 }}" y="{{ ((points[1] + points[3]) / 2) - 14 }}" text-anchor="middle" font-size="11" font-weight="700" fill="#0d6efd">{{ distance }}</text>
</svg>
{%- endmacro %}
