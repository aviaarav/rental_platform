<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Admin{% endblock %} | RentServe Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="d-flex admin-wrapper">
    <aside class="admin-sidebar d-flex flex-column p-3">
        <div class="fw-bold fs-5 text-white mb-4"><i class="bi bi-box-seam me-1"></i> RentServe Admin</div>
        <ul class="nav nav-pills flex-column gap-1 mb-auto">
            <li><a class="nav-link {{ 'active' if request.endpoint == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <!-- Connected in Stage 6 -->
            <li><a class="nav-link" href="#"><i class="bi bi-people me-2"></i>Users</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-tools me-2"></i>Resources</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-journal-check me-2"></i>Bookings</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-clock-history me-2"></i>Activity Logs</a></li>
        </ul>
        <a class="nav-link text-white mt-3" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-left me-2"></i>Logout</a>
    </aside>

    <div class="flex-grow-1 admin-main">
        <header class="admin-topbar d-flex justify-content-between align-items-center px-4 py-2">
            <span class="small text-muted">Admin Panel / {% block crumb %}Dashboard{% endblock %}</span>
            <span class="small fw-semibold text-deep">{{ current_user.email }}</span>
        </header>
        <div class="p-4">
            {% include 'partials/_flash.html' %}
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
